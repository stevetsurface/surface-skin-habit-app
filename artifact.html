<title>Surface</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone shell (max 480px) mirroring the Surface website build: sticky blurred header with the
   SURFACE / SKIN HABIT lockup, blush hero panel with the white S-line mark, white cards, full-width bottom tab bar.
   Tokens are the website's own (website/assets/style.css). Light only, like the site. */
:root{
  --bg:#FBF7F4; --panel:#F4E3DD; --panel-soft:#F8EEEA; --card:#FFFFFF;
  --ink:#1E1917; --ink-soft:#4A3F3A; --muted:#7A6B65; --line:#EADBD4;
  --accent:#9B5A47; --accent-deep:#874838; --accent-ink:#FFF7F3;
  --wa:#25D366; --ok:#2F7A54; --ok-soft:#E4F1E8; --warn:#A8651D; --warn-soft:#FBEDD6; --bad:#B23F33; --bad-soft:#F8E1DD;
  --shadow:0 1px 2px rgba(60,30,20,.04),0 10px 30px -18px rgba(60,30,20,.18);
  --font:"Gotham","Gotham A","Gotham B","Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r:22px; --r-sm:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent)}
h1,h2,h3{margin:0;font-weight:600;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:30px}
h2{font-size:22px}
h3{font-size:17px;letter-spacing:-.01em}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg)}
@media (min-width:520px){ body{background:var(--panel-soft)} #app{box-shadow:0 0 0 1px var(--line);min-height:100vh} }

/* header (site-header) */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(251,247,244,.86);backdrop-filter:saturate(1.3) blur(10px);-webkit-backdrop-filter:saturate(1.3) blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px;height:68px}
.logo{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.logo img{width:22px;height:36px;object-fit:contain}
.logo .wm2{display:flex;flex-direction:column;line-height:1}
.logo .l1{font-weight:600;font-size:19px;letter-spacing:.32em;margin-right:-.32em}
.logo .l2{font-weight:600;font-size:8.5px;letter-spacing:.3em;margin-top:5px;color:var(--ink-soft)}
.top .ttl{font-weight:600;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.top .sp{flex:1}
.ib{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;position:relative;color:var(--ink);background:#fff;border:1px solid var(--line)}
.ib svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib .dot{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--bg)}

/* view */
#view{flex:1;padding:18px 18px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;min-width:0;animation:enter .25s ease}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row>*{min-width:0}
.grow{flex:1}
.eyebrow{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.lead{font-size:16.5px;color:var(--ink-soft);line-height:1.6}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.b{font-weight:600}
.num{font-variant-numeric:tabular-nums}
.center{text-align:center}

/* hero-card */
.hero-card{position:relative;overflow:hidden;background:var(--panel);border-radius:28px;padding:26px 22px 22px;display:flex;flex-direction:column;gap:14px}
.hero-card .mark{position:absolute;right:-60px;top:-50px;width:240px;height:240px;opacity:.55;pointer-events:none}
.hero-card .mark path{stroke:#fff;stroke-width:2.5;fill:none;stroke-linecap:round}
.hero-card>*{position:relative}
.hero-card h1{font-size:30px}
.hero-aside{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.trust{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--muted)}
.trust b{color:var(--ink);font-weight:600}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card.panel{background:var(--panel);border-color:transparent;box-shadow:none}
.card.soft{background:var(--panel-soft);border-color:transparent;box-shadow:none}
.card.flat{box-shadow:none}
.card.accent{background:var(--accent);color:var(--accent-ink);border-color:transparent;position:relative;overflow:hidden;border-radius:28px}
.card.accent .muted,.card.accent .eyebrow{color:rgba(255,247,243,.78)}
.card.accent .wm{position:absolute;right:-50px;top:-50px;width:220px;height:220px;opacity:.25;pointer-events:none}
.card.accent .wm path{stroke:#fff;stroke-width:2.5;fill:none;stroke-linecap:round}
.card.accent .btn.soft{background:rgba(255,255,255,.16);color:var(--accent-ink);border-color:rgba(255,255,255,.3)}
.card h2+p,.card h3+p{margin-top:4px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:10px}
.sec h2{font-size:22px}
.link{color:var(--accent);font-weight:600;font-size:14px;background:none;text-decoration:none}
.list{display:flex;flex-direction:column}
.list>.it{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line);text-align:left;width:100%;min-width:0;color:inherit;text-decoration:none}
.list>.it:first-child{border-top:0}
.it .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.it .body .t{font-weight:600}
.it .body .s{font-size:13px;color:var(--muted);line-height:1.45}
.it .chev{color:var(--accent);flex:none}
.it .chev svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.it .ico{width:44px;height:44px;border-radius:50%;background:var(--panel);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.it .ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
ul.clean{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
ul.clean li{display:flex;gap:10px;align-items:flex-start;line-height:1.5}
ul.clean li:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;margin-top:8px}
.nsteps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.nsteps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;font-size:14.5px;color:var(--ink-soft)}
.nsteps b{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;align-items:center;justify-content:center;font-size:14px;font-weight:600}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500;background:var(--panel-soft);color:var(--accent-deep);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--panel);color:var(--accent-deep)}
.pill.start,.pill.correct,.pill.refine{background:transparent;color:var(--accent);padding:0;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.pill.ghost{background:#fff;color:var(--accent-deep)}
.chips{display:flex;gap:8px;flex-wrap:wrap}

/* buttons (site .btn) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 22px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;border:1.5px solid transparent;transition:transform .12s ease,background .12s ease,border-color .12s ease;min-height:50px;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-deep)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.hero-card .btn.ghost{border-color:rgba(255,255,255,.95);background:rgba(255,255,255,.35)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.soft{background:var(--panel-soft);color:var(--ink)}
.btn.wa{background:var(--ink);color:#fff}
.btn.sm{padding:10px 16px;font-size:14px;min-height:42px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn svg.fill{fill:currentColor;stroke:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}

/* photo cards */
.ph{display:block;width:100%;background:var(--panel) center/cover no-repeat}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;text-align:left;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);min-width:0;transition:transform .15s ease,border-color .15s ease}
.tile:active{transform:scale(.985)}
.tile .ph{aspect-ratio:4/3}
.tile .tb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px}
.tile .t{font-weight:600;font-size:15.5px;letter-spacing:-.01em}
.tile .s{font-size:12.5px;color:var(--muted);line-height:1.4}
.tile .l{font-size:13px;font-weight:600;color:var(--accent);margin-top:6px}
.circ{width:38px;height:38px;border-radius:50%;background:var(--panel-soft);display:inline-flex;align-items:center;justify-content:center;color:var(--accent);flex:none}
.circ svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* progress */
.dots{display:flex;gap:5px}
.dots i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.dots i.on{background:var(--accent)}
.dots i.next{background:var(--panel);outline:1.5px dashed var(--accent);outline-offset:-1.5px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.ring{width:80px;height:80px;position:relative;flex:none}
.ring svg{width:80px;height:80px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .bgc{stroke:var(--panel)}
.ring .fgc{stroke:var(--accent)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring .lbl b{font-size:19px;font-weight:600}
.ring .lbl span{font-size:10px;color:var(--muted);margin-top:3px}

/* bottom tab bar (site wa-bar) */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none}
.tabs .in{pointer-events:auto;width:100%;max-width:480px;background:rgba(251,247,244,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:10.5px;font-weight:600;color:var(--muted)}
.tabs button .ti{width:46px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent)}
.tabs button.on .ti{background:var(--panel)}

/* wizard */
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:0;box-shadow:var(--shadow);transition:border-color .12s}
.opt.sel{background:var(--panel);border-color:transparent;outline:1.5px solid var(--accent)}
.opt .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.opt .t{font-weight:600}
.opt .s{font-size:13px;color:var(--muted);line-height:1.45}
.opt .price{font-weight:600;font-size:13.5px;white-space:nowrap;color:var(--ink)}
.opt .av{width:48px;height:48px;border-radius:50%;background:var(--panel) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;color:var(--accent);flex:none;overflow:hidden}
.opt .th{width:72px;height:56px;border-radius:12px;background:var(--panel) center/cover no-repeat;flex:none}
.opt .chev{color:var(--accent)}
.opt .chev svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ctabs{display:flex;gap:6px;overflow-x:auto;padding:2px 18px 6px;margin:0 -18px;scrollbar-width:none}
.ctabs::-webkit-scrollbar{display:none}
.ctabs button{padding:9px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap;color:var(--ink)}
.ctabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 18px 8px;margin:0 -18px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:none;width:58px;padding:9px 4px;border-radius:16px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink)}
.days button .d{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.days button .n{font-size:19px;font-weight:600}
.days button .m{font-size:10.5px;color:var(--muted)}
.days button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.days button.on .d,.days button.on .m{color:rgba(255,247,243,.8)}
.days button.sug:not(.on){border:1.5px dashed var(--accent)}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.times button{padding:10px 4px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;color:var(--ink)}
.times button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.times button:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
textarea.ta,input.in{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;resize:vertical;min-height:46px}
textarea.ta:focus,input.in:focus{border-color:var(--accent);outline:none}
.kv{display:grid;grid-template-columns:100px 1fr;gap:8px 12px;font-size:14.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.notice{display:flex;gap:10px;padding:13px 15px;border-radius:14px;font-size:13.5px;align-items:flex-start;line-height:1.5}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.ok{background:var(--ok-soft);color:var(--ok)}
.notice.info{background:var(--panel-soft);color:var(--ink-soft)}
.notice svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}

/* chat */
.chat{display:flex;flex-direction:column;gap:8px;flex:1}
.msg{max-width:84%;padding:11px 15px;border-radius:20px;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.msg.dr{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:12px;text-align:center;max-width:100%}
.msg .ts{display:block;font-size:10.5px;opacity:.7;margin-top:4px}
.msg img{max-width:100%;border-radius:12px;display:block;margin-bottom:6px}
.composer{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding-top:8px}
.composer textarea{flex:1;border:1px solid var(--line);border-radius:24px;padding:12px 16px;background:#fff;resize:none;min-height:48px;max-height:120px}
.composer label.att{width:48px;height:48px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--accent);cursor:pointer;flex:none}
.composer label.att input{display:none}
.composer label.att svg,.composer .send svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.composer .send{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex:none}
.attprev{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.attprev img{width:44px;height:44px;object-fit:cover;border-radius:10px}

/* analysis */
.aq-opts{display:flex;flex-direction:column;gap:8px}
.aq-opt{text-align:left;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:500}
.aq-opt.sel{background:var(--panel);border-color:transparent;outline:1.5px solid var(--accent);font-weight:600}
.aq-yn{flex-direction:row}
.aq-yn .aq-opt{flex:1;text-align:center}

/* loyalty */
.tier{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
.tier .pts{font-size:44px;font-weight:600;line-height:1;letter-spacing:-.03em}
.rewards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.reward{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;color:var(--ink);box-shadow:var(--shadow);min-height:96px}
.reward .t{font-weight:600;font-size:14px;line-height:1.3}
.reward .c{font-size:12px;font-weight:700;color:var(--accent);margin-top:auto;letter-spacing:.04em}
.reward:disabled{opacity:.45}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;letter-spacing:.14em;font-size:18px;background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:14px;display:inline-block}

/* timeline */
.tl{display:flex;flex-direction:column}
.tl .ev{display:grid;grid-template-columns:18px 1fr;gap:12px;padding-bottom:18px;position:relative}
.tl .ev:before{content:"";position:absolute;left:8px;top:18px;bottom:0;width:2px;background:var(--line)}
.tl .ev:last-child:before{display:none}
.tl .ev .pt{width:18px;height:18px;border-radius:50%;background:var(--panel);border:3px solid var(--accent);margin-top:2px}
.tl .ev.past .pt{background:#fff;border-color:var(--line)}
.tl .ev .body{min-width:0}

/* toggle */
.tg{position:relative;width:46px;height:28px;border-radius:14px;background:var(--line);flex:none;transition:background .15s}
.tg i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg.on{background:var(--accent)}
.tg.on i{left:21px}

/* sheet + toast */
#sheet{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(30,25,23,.45)}
#sheet.open{display:flex}
#sheet .pane{width:100%;max-width:480px;background:var(--bg);border-radius:28px 28px 0 0;padding:14px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:12px;animation:up .2s ease}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 4px}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}

var TIERS=[{code:'start',name:'Start',min:0},{code:'habit',name:'Habit',min:1000},{code:'glow',name:'Glow',min:5000}];
function tierOf(p){var t=TIERS[0];TIERS.forEach(function(x){if(p>=x.min)t=x;});return t;}
function nextTier(p){for(var i=0;i<TIERS.length;i++){if(p<TIERS[i].min)return TIERS[i];}return null;}
function remaining(p){return Math.max(0,p.total-p.used);}
function pkgStatus(p){var r=remaining(p),dd=days(p.expires);if(r===0)return {code:'done',label:'Selesai',cls:'ok'};if(dd<0)return {code:'expired',label:'Kedaluwarsa',cls:'bad'};if(dd<=30)return {code:'soon',label:'Berakhir '+dd+' hari lagi',cls:'warn'};return {code:'active',label:'Aktif',cls:'ok'};}
function activePkgs(){return S.packages.filter(function(p){return remaining(p)>0&&days(p.expires)>=0;}).sort(function(a,b){return a.expires<b.expires?-1:1;});}
function nextAppt(){return S.appointments.filter(function(a){return a.status==='confirmed'&&days(a.date)>=0;}).sort(function(a,b){return (a.date+a.time)<(b.date+b.time)?-1:1;})[0];}
function lastVisit(){return S.visits[0];}
function lastVisitOf(offer){return S.visits.filter(function(v){return v.offer===offer;})[0];}
function devicesFor(includes){
  var out=[];(includes||[]).forEach(function(inc){var li=inc.toLowerCase();D.treatments.forEach(function(t){if(!t.device)return;var tok=t.name.toLowerCase().split(/[^a-z0-9]+/).filter(function(w){return w.length>=3;})[0];if(tok&&li.indexOf(tok)>=0){var dev=D.devices.filter(function(d){return d.slug===t.device;})[0];if(dev&&out.indexOf(dev)<0)out.push(dev);}});});
  return out;
}
function notifs(){
  var n=[],a=nextAppt();
  if(a)n.push({ico:I.cal,t:'Pengingat jadwal',s:a.what+(a.session?' sesi '+a.session+'/'+a.total:'')+' · '+fd(a.date)+' '+ft(a.time)+' · '+clinic(a.clinic).short,go:'home'});
  S.packages.forEach(function(p){var st=pkgStatus(p);if(st.code==='soon')n.push({ico:I.pkg,t:p.offer+': '+remaining(p)+' sesi tersisa',s:'Berlaku sampai '+fd(p.expires)+'. Booking sekarang supaya tidak hangus.',go:'paket',warn:true});});
  if(S.plan)n.push({ico:I.clip,t:'Tinjauan minggu ke-12',s:'Dengan '+S.plan.by+' · '+fd(S.plan.review)+'. Foto 3 sudut diulang untuk dibandingkan.',go:'plan'});
  var th=S.threads.dr;for(var i=th.length-1;i>=0;i--){if(th[i].from==='dr'){n.push({ico:I.chat,t:S.user.doctor+' membalas chat kamu',s:th[i].text.slice(0,70)+'…',go:'chat'});break;}}
  if(S.pointLog[0])n.push({ico:I.star,t:'+'+S.pointLog[0].delta+' poin',s:S.pointLog[0].label,go:'loyalty'});
  return n;
}

var AQ=null,Aans={},Astep=0;
function aqList(){if(AQ)return AQ;AQ=[];D.assessment.blocks.forEach(function(b){b.questions.forEach(function(q){q.block=b;AQ.push(q);});});return AQ;}
function aqConcern(){var q1=aqList()[0],o=(q1.options||[]).filter(function(x){return x.v===Aans.q1;})[0];return o&&o.concern?o.concern:'TONE';}
function aqOptions(q){if(q.options_by_concern)return q.options_by_concern[aqConcern()]||[];return q.options||[];}
VIEWS.analisis=function(){
  var Q=aqList(),h='';
  if(S.analysis&&Astep===0&&!Aans.q1){var r=S.analysis;h+='<div class="card panel"><div class="eyebrow">Hasil terakhir · '+esc(fd(r.date))+'</div><div class="b">'+esc(r.concernName)+' → '+esc(r.offer)+'</div><div class="small muted">'+esc(r.offerIncludes)+'</div><div class="btns" style="margin-top:10px"><button class="btn primary sm" data-act="bookoffer" data-o="'+esc(r.offer)+'">Booking</button><button class="btn ghost sm" data-act="aqreset">Ulangi analisis</button></div></div>';}
  if(Astep>=Q.length)return h+aqResult();
  var q=Q[Astep],pct=Math.round(Astep/Q.length*100);
  h+='<div class="bar"><i style="width:'+pct+'%"></i></div><div class="eyebrow">'+esc(q.block.code)+' · '+esc(q.block.title)+' · '+(Astep+1)+' dari '+Q.length+'</div>';
  if(q.block.intro&&q.block.questions[0]===q)h+='<p class="small muted">'+esc(q.block.intro)+'</p>';
  h+='<h1 style="font-size:21px">'+esc(q.text)+'</h1>'+(q.help?'<p class="small muted">'+esc(q.help)+'</p>':'');
  if(q.type==='single'||q.type==='multi'){h+='<div class="aq-opts">'+aqOptions(q).map(function(o){var sel=q.type==='multi'?(Aans[q.id]||[]).indexOf(o.v)>=0:Aans[q.id]===o.v;return '<button class="aq-opt'+(sel?' sel':'')+'" data-act="aqopt" data-v="'+esc(o.v)+'">'+esc(o.label)+'</button>';}).join('')+'</div>';}
  else if(q.type==='yesno'){h+='<div class="aq-opts aq-yn"><button class="aq-opt'+(Aans[q.id]==='ya'?' sel':'')+'" data-act="aqopt" data-v="ya">Ya</button><button class="aq-opt'+(Aans[q.id]==='tidak'?' sel':'')+'" data-act="aqopt" data-v="tidak">Tidak</button></div>';}
  else if(q.type==='text'){h+='<textarea class="ta" id="aqtext" rows="3" placeholder="'+esc(q.placeholder||'')+'">'+esc(Aans[q.id]||'')+'</textarea>';}
  var optional=q.type==='text'||q.type==='multi';
  h+='<div class="btns">'+(Astep>0?'<button class="btn ghost" data-act="aqback">Kembali</button>':'')+'<button class="btn primary" data-act="aqnext"'+(optional||Aans[q.id]?'':' disabled')+'>'+(optional&&!Aans[q.id]?'Lewati':'Lanjut')+'</button></div>';
  if(Astep===0)h+='<p class="tiny muted">'+esc(D.assessment.subtitle)+'</p>';
  return h;
};
function aqResult(){
  var Q=aqList(),code=aqConcern(),con=concernOf(code),q2=Q[1],o2=aqOptions(q2).filter(function(x){return x.v===Aans.q2;})[0],off=o2&&o2.offer?offerByName(o2.offer):con.offers[0],q9=Q.filter(function(q){return q.id==='q9';})[0],o9=q9?(q9.options||[]).filter(function(x){return x.v===Aans.q9;})[0]:null,planKey=o9?o9.plan:'single';
  var flags=Q.filter(function(q){return q.type==='yesno'&&Aans[q.id]==='ya';}).map(function(q){return q.flag;});
  var price=planKey==='consult'?'Konsultasi dulu, gratis':planKey==='single'?(off.single?rp(off.single)+' satuan':'Ditentukan dokter'):off[planKey]?rp(off[planKey])+' · '+(planKey==='pack3'?3:6)+' sesi':(off.single?rp(off.single)+' satuan (paket '+(planKey==='pack3'?'3':'6')+'x tidak tersedia untuk program ini)':'Ditentukan dokter');
  S.analysis={date:iso(today()),concern:code,concernName:con.name+' · '+con.title,offer:off.name,offerIncludes:off.includes.join(' · '),plan:planKey,flags:flags};save();
  var lv=D.levels.filter(function(l){return l.code===off.level;})[0];
  var h='<div class="eyebrow">Hasil analisis</div><div class="card accent"><div class="eyebrow">Concern yang paling cocok</div><h1>'+esc(con.name)+'</h1><p class="small" style="margin-top:4px">'+esc(con.title)+'</p></div>';

  if(flags.length)h+='<div class="notice warn">'+I.warn+'<span>Dokter akan memeriksa dulu: '+esc(flags.join('; '))+'. Jawaban "ya" tidak berarti tidak bisa treatment, hanya menentukan tindakan mana yang aman.</span></div>';

  h+='<p class="tiny muted">'+esc(D.assessment.disclaimer)+'</p>';
  h+='<div class="stack"><button class="btn primary block" data-act="bookoffer" data-o="'+esc(off.name)+'">Booking '+(planKey==='consult'?'konsultasi gratis':off.name)+'</button><button class="btn ghost block" data-act="aqsend">Kirim hasil ke '+esc(S.user.doctor)+'</button><button class="btn soft block" data-act="aqreset">Ulangi analisis</button></div>';
